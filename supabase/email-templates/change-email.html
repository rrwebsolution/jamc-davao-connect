<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f5f1ec;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1c1917;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f1ec;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;border:1px solid #e7e0d8;">
            <tr>
              <td style="padding:28px 32px 8px;">
                <p style="margin:0;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#7c2d12;">JAMC Davao Connect</p>
                <h1 style="margin:12px 0 0;font-size:22px;line-height:1.3;">Confirm your new email address</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 0;font-size:15px;line-height:1.6;color:#44403c;">Confirm that you want to use {{ .NewEmail }} to sign in to JAMC Davao Connect.</td>
            </tr>
            <tr>
              <td style="padding:24px 32px;">
                <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email_change" style="display:inline-block;background:#7c2d12;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 22px;border-radius:10px;">Confirm new email</a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 28px;font-size:13px;line-height:1.6;color:#78716c;">If you did not ask for this change, contact your church administrator.</td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:12px;color:#a8a29e;">JAMC-Davao &middot; JAMC Davao Connect</p>
        </td>
      </tr>
    </table>
  </body>
</html>
